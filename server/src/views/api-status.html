<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuizNest API</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }

      .card {
        text-align: center;
        padding: 40px;
        border-radius: 20px;
        background: white;
        box-shadow: 0 10px 30px #0001;
      }

      .status {
        color: #16a34a;
        font-weight: bold;
      }

      p {
        color: #64748b;
      }
    </style>
  </head>

  <body>
    <div class="card">
      <h1>🚀 QuizNest API</h1>
      <p class="status">● API is running</p>
      <p>Backend services are online and ready.</p>
    </div>
  </body>
</html>
